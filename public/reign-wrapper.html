<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REIGN — Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#FAF7F4}
iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>
<iframe id="preview" src="reign-preview.html"></iframe>
<script>
var IMAGES = {
  heroModel:     'images/model-curly-1.png',
  heroVideo:     '',
  editorialBanner: 'images/model-straight-1.png',
  strip1: 'images/model-curly-1.png',
  strip2: 'images/model-straight-2.png',
  strip3: 'images/model-curly-2.png',
  strip4: 'images/hero-model.png',
  strip5: 'images/model-straight-1.png',
  strip6: 'images/model-curly-1.png',
  'shop-wavy':          'images/hair-wavy.png',
  'shop-wavyCurly':     'images/hair-curly.png',
  'shop-curly':         'images/hair-deep-curly.png',
  'shop-closureWavy':   'images/hair-wavy.png',
  'shop-closureWavyCurly': 'images/hair-curly.png',
  'shop-closureCurly':  'images/hair-deep-curly.png',
  guide1: 'images/model-straight-2.png',
  guide2: 'images/model-curly-2.png',
  look1:  'images/model-curly-1.png',
  look2:  'images/model-straight-1.png',
  look3:  'images/model-curly-2.png',
  look4:  'images/hero-model.png',
  look5:  'images/model-straight-2.png',
  look6:  'images/model-curly-1.png',
  look7:  'images/model-straight-1.png',
  look8:  'images/model-curly-2.png',
  look9:  'images/hero-model.png',
  look10: 'images/model-straight-2.png',
  aboutHero:    'images/model-curly-1.png',
  aboutMission: 'images/model-straight-1.png'
};

var iframe = document.getElementById('preview');
iframe.addEventListener('load', function() {
  var doc = iframe.contentDocument;
  if (!doc) return;

  /* Remove visibility:hidden from all images */
  var imgs = doc.querySelectorAll('img');
  for (var i = 0; i < imgs.length; i++) {
    imgs[i].style.visibility = 'visible';
  }

  /* Inject image sources by ID */
  for (var key in IMAGES) {
    if (!IMAGES[key]) continue;
    var el = doc.getElementById('img-' + key);
    if (el) {
      el.src = IMAGES[key];
      el.style.visibility = 'visible';
    }
  }

  /* Handle dynamically rendered product cards */
  setTimeout(function() {
    for (var key in IMAGES) {
      if (!IMAGES[key]) continue;
      var els = doc.querySelectorAll('#img-' + key);
      for (var j = 0; j < els.length; j++) {
        els[j].src = IMAGES[key];
        els[j].style.visibility = 'visible';
      }
      /* Also match by id across shadow copies */
      var all = doc.querySelectorAll('[id="img-' + key + '"]');
      for (var j = 0; j < all.length; j++) {
        all[j].src = IMAGES[key];
        all[j].style.visibility = 'visible';
      }
    }
  }, 500);
});
</script>
</body>
</html>
