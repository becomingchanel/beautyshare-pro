var PRODUCT_IMAGES = {
  'Wavy': {
    model: 'images/bookednbusy_httpss.mj.run8JYQyWSkz8U_httpss.mj.runVzdyB9JOhcE_d744c41e-ab18-41fa-b772-97d70b1af4de_0.png',

  'Wavy/Curly': {

  'Curly': {
    model: 'images/bookednbusy_beautiful_african_american_model_with_long_curly__51010a4e-1b47-4e83-b586-9d49e12f9884_3.png',
    hair: 'images/hair-deep-curly.png'
  }
};

var iframe = document.getElementById('preview');

function injectImages(doc) {
  if (!doc) return;
  var imgs = doc.querySelectorAll('img');
  for (var i = 0; i < imgs.length; i++) { imgs[i].style.visibility = 'visible'; }
  for (var key in IMAGES) {
    if (!IMAGES[key]) continue;
    var all = doc.querySelectorAll('[id="img-' + key + '"]');
    for (var j = 0; j < all.length; j++) { all[j].src = IMAGES[key]; all[j].style.visibility = 'visible'; }
  }
  if (IMAGES.heroVideo) {
    var video = doc.getElementById('hero-video');
    if (video) { var source = video.querySelector('source'); if (source) source.src = IMAGES.heroVideo; video.load(); video.style.visibility = 'visible'; }
  }
}

function injectProductImages(doc, texture) {
  if (!doc || !texture) return;
  var pi = PRODUCT_IMAGES[texture];
  if (!pi) return;
  var heroImg = doc.querySelector('.pd-hero-img img');
  if (heroImg) { heroImg.src = pi.model; heroImg.style.visibility = 'visible'; }
  var galItems = doc.querySelectorAll('.pd-gal-item img');
  for (var i = 0; i < galItems.length; i++) {
    galItems[i].src = (i === 0) ? pi.model : pi.hair;
    galItems[i].style.visibility = 'visible';
  }
  setTimeout(function() {
    for (var key in IMAGES) {
      if (!IMAGES[key]) continue;
      var all = doc.querySelectorAll('[id="img-' + key + '"]');
      for (var j = 0; j < all.length; j++) { all[j].src = IMAGES[key]; all[j].style.visibility = 'visible'; }
    }
  }, 100);
}

iframe.addEventListener('load', function() {
  var doc = iframe.contentDocument;
  if (!doc) return;
  injectImages(doc);
  setTimeout(function() { injectImages(doc); }, 500);
  var iframeWin = iframe.contentWindow;
  if (iframeWin) {
    iframeWin.addEventListener('productShown', function(e) {
      var texture = e.detail && e.detail.texture;
      setTimeout(function() { injectProductImages(doc, texture); }, 50);
    });
  }
});
