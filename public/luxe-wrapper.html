<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>*{margin:0;padding:0;overflow:hidden}iframe{width:100%;height:100vh;border:none}</style>
</head>
<body>
<iframe id="preview"></iframe>
<script>
(function(){
  var page = new URLSearchParams(location.search).get('page') || 'home';
  var f = document.getElementById('preview');
  f.src = '/luxe-preview.html#' + page;
  f.onload = function(){
    try {
      var d = f.contentDocument;
      /* Make all images visible */
      d.querySelectorAll('img').forEach(function(img){ img.style.visibility = 'visible'; });
      /* Navigate to the right page tab if the preview has page switching */
      var pageMap = { home: 'HOME', shop: 'PRODUCT', product: 'PRODUCT', contact: 'HOME' };
      var tabs = d.querySelectorAll('.page-tab');
      tabs.forEach(function(tab){
        if (tab.textContent.trim() === (pageMap[page] || 'HOME')) {
          tab.click();
        }
      });
    } catch(e){}
  };
})();
</script>
</body>
</html>
